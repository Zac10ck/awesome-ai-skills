name: Discovery review

on:
  schedule:
    - cron: "31 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  review-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Create monthly editorial review issue
        uses: actions/github-script@v7
        with:
          script: |
            const month = new Date().toISOString().slice(0, 7);
            const title = `Catalog quality review — ${month}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'editorial-review',
            });
            if (!existing.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['editorial-review', 'automated'],
                body: [
                  'Monthly maintainer review checklist:',
                  '',
                  '- Review link-check failures across multiple runs.',
                  '- Check recently changed or archived upstream projects.',
                  '- Review open resource requests and primary-source evidence.',
                  '- Look for duplicate URLs and outdated compatibility claims.',
                  '- Research promising resources from official release channels.',
                  '',
                  'Discovery is advisory. Do not add resources without human review.',
                ].join('\n'),
              });
            }
