name: Validate resources

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "README.md"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_resources.py
      - run: python3 scripts/generate_readme.py
      - name: Ensure generated README is current
        run: git diff --exit-code -- README.md
